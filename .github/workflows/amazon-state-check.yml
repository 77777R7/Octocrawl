name: Amazon.sg state check

# Once a day, preview fixed Amazon.sg products on the hosted preview. A failed run (GitHub emails the owner) means
# no product came back complete; scripts/public-preview/check-amazon-state.mjs says whether the state has expired.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/public-preview/check-amazon-state.test.mjs
      - run: node scripts/public-preview/check-amazon-state.mjs
