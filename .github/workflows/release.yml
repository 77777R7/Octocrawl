name: Release

# Publishes the npm packages (octocrawl, @octocrawl/cli, @octocrawl/sdk,
# @octocrawl/mcp) and the Python client (octocrawl-client) from a tag vX.Y.Z,
# through trusted publishing: no token is stored anywhere, and npm records the
# packages' provenance (this repository, this workflow, this commit).
#
# Before the first run, a maintainer registers this workflow as a trusted
# publisher for each package on npmjs.com and for octocrawl-client on pypi.org,
# and creates the GitHub environment `release` (see CONTRIBUTING.md, Releasing).
# The publish jobs wait for that environment's approval when it requires one.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Every published version says the tag's
        run: node scripts/release-version.mjs check "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Pack the npm packages
        run: npm run pack:packages
      - name: Install the tarballs in a new project and use each package
        run: node scripts/check-packages.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and check the Python client
        run: |
          python -m pip install --upgrade build twine
          python -m pip install -e "python[test]"
          python -m pytest -q python/tests
          python -m build python --outdir dist-python
          python -m twine check dist-python/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarballs
          path: .w2l/pack/tarballs/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist-python/*
          if-no-files-found: error

  # The packed CLI's native modules (better-sqlite3, impit) on every platform it is published for.
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/check-native-deps.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarballs
          path: tarballs
      - name: Install the packed CLI and scrape over undici and impit
        run: node scripts/check-native-deps.mjs tarballs

  npm:
    needs: [build, native]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0: no always-auth line in .npmrc
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarballs
          path: tarballs
      - name: Publish each package, skipping a version already published
        shell: bash
        run: |
          set -euo pipefail
          # The SDK first, the CLI under both names, then the MCP server.
          for file in tarballs/octocrawl-sdk-*.tgz tarballs/octocrawl-cli-*.tgz tarballs/octocrawl-[0-9]*.tgz tarballs/octocrawl-mcp-*.tgz; do
            name=$(tar -xzOf "$file" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            version=$(tar -xzOf "$file" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipped"
              continue
            fi
            # ./ in front: without it npm 11 reads tarballs/<name>.tgz as a GitHub owner/repo shorthand and runs git.
            npm publish "./$file" --access public
          done

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
