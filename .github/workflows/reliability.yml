name: Local Reliability Gate

on:
  push:
  pull_request:

jobs:
  linux:
    name: linux (${{ matrix.project }})
    runs-on: ubuntu-latest
    # The timed test step alone takes 12-13 minutes, so the timed job gets room
    # for a slow npm ci; its test step keeps its own bound below.
    timeout-minutes: ${{ matrix.project == 'timed' && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        project: [unit, timed, perf]
    steps:
      - name: Runner CPU (perf test timings vary by model)
        run: lscpu
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The packages come from the npm cache. The audit is a registry request whose
      # result CI never reads, and it never finished in the 6-7 minute installs.
      - run: npm ci --no-audit
      # The browsers are cached by Playwright's version. --with-deps is left out: the runner image already has the
      # libraries Chromium links against, so its apt step only added fonts, and on 2026-10-26 the Ubuntu mirror served
      # them at 30 kB/s, which took the install to 11-15 minutes and cancelled jobs before any test ran.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Playwright
        timeout-minutes: 5
        run: |
          npx playwright install chromium
          if ldd "$(node -p "require('playwright').chromium.executablePath()")" | grep 'not found'; then
            echo "::warning::Chromium misses libraries on this runner image; installing them from apt"
            npx playwright install-deps chromium
          fi
      # Saved before the tests, so a job whose tests fail or are cancelled still leaves the browsers for its re-run.
      - uses: actions/cache/save@v4
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - run: npm run typecheck
      - run: npm test -- --project=${{ matrix.project }} --reporter=default --reporter=json --outputFile=test-results/${{ matrix.project }}.json
        timeout-minutes: ${{ matrix.project == 'timed' && 17 || 15 }}
      - name: A batch of 1,000 URLs over 20 hosts survives kill -9 (0 lost, 0 duplicated)
        if: matrix.project == 'unit'
        run: npm run verify:batch-crash-1000
      - name: Check for orphaned Chromium processes
        if: always()
        run: |
          if pgrep -af '[m]s-playwright|[c]hromium_headless_shell|[c]hrome-headless-shell' >/tmp/w2l-chromium-processes.txt; then
            cat /tmp/w2l-chromium-processes.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/${{ matrix.project }}.json
          if-no-files-found: error

  # Preserve the existing required check name. A cancelled, skipped or failed
  # matrix member must not turn the aggregate gate green.
  test:
    needs: linux
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: All Linux projects passed
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          if [ "$LINUX_RESULT" != "success" ]; then
            echo "::error::Linux projects ended with $LINUX_RESULT"
            exit 1
          fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: w2l serve on Windows scrapes, is killed mid-batch, restarts and resumes the batch
        run: npm run verify:serve-smoke
